[project]
name = "nyan-shop-bot"
version = "0.1.0"
description = "Mock-first Telegram reseller foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram==3.31.0",
  "alembic==1.20.1",
  "asyncpg==0.32.0",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "pydantic-settings==2.16.2",
  "pyyaml==6.0.3",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.4.0",
  "pip-tools==7.6.2",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1",
  "ruff==0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["nyan-bootstrap"]

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"scripts/github_seed.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["nyan_shop_bot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a local PostgreSQL database",
]
